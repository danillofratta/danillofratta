# Save as .github/workflows/medium-posts.yml in the danillofratta/danillofratta repository.
# Updates the "Latest articles" section of the profile README with your newest Medium posts.
name: Latest Medium articles

on:
  schedule:
    - cron: "0 9 * * *" # every day at 06:00 in Brazil (09:00 UTC)
  workflow_dispatch: # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://medium.com/feed/@danillo.fratta"
          max_post_count: 5
